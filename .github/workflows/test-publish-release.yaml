name: Test, publish, release

on:
  - push
  - pull_request

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false


env:
  PROTOBUF_VERSION: "33.0"

jobs:
  ensure-protos-up-to-date:
    name: Ensure Protos Are Up To Date
    # Go no further if this job fails.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install Protoc
        run: |
          wget https://github.com/protocolbuffers/protobuf/releases/download/v$PROTOBUF_VERSION/protoc-$PROTOBUF_VERSION-linux-x86_64.zip
          sudo unzip protoc-$PROTOBUF_VERSION-linux-x86_64.zip -d /usr/local
          rm protoc-$PROTOBUF_VERSION-linux-x86_64.zip
      - name: Run proto generation script
        run: sh resources/scripts/protoc.sh
      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Protos are not up to date. Please run the proto generation script.";
            git status
            exit 1;
          else
            echo "Protos are up to date.";
          fi
          
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: ensure-protos-up-to-date
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        name: Set up Rust for caching
      - name: Build
        run: cargo build
      - name: Run tests
        run: |
          cargo test --verbose --workspace 

  rust-formatting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: ensure-protos-up-to-date

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        name: Set up Rust for caching
        with:
          components: rustfmt

      - name: Lint for formatting
        run: cargo fmt --all -- --check

  rust-lint:
    name: Lint for warnings
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: ensure-protos-up-to-date
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        name: Set up Rust for caching
        with:
          components: clippy
      - name: Lint for warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

  python-test:
    name: Python Tests
    needs: ensure-protos-up-to-date
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
        platform: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packages
        run: |
          pip install '.'
      # Run tests here when we have some. For now just check we import OK
      - name: Test import
        run: |
          python -c "import gfmetadata"

  python-black:
    needs: ensure-protos-up-to-date
    name: Python Black
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.14
      - name: Install packages
        run: |
          pip install black
      - name: Check formatting with Black
        run: |
          black --check . --exclude '_pb2.py$'

  create-github-release:
    if: contains(github.ref, 'refs/tags/v')
    name: Create GitHub Release
    needs:
      - python-test
      - python-black
      - rust-test
      - rust-lint
      - rust-formatting
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
      - name: Get release notes
        id: release_notes
        run: |
          # By default, GH Actions checkout will only fetch a single commit.
          # For us to extract the release notes, we need to fetch the tags
          # and tag annotations as well.
          # https://github.com/actions/checkout/issues/290
          git fetch --tags --force
          TAG_NAME=${GITHUB_REF/refs\/tags\//}
          echo "$(git tag -l --format='%(contents)' $TAG_NAME)" > "${RUNNER_TEMP}/CHANGELOG.md"

      - name: Create GitHub release if needed
        id: create_release
        run: |
          if ! gh release view ${GITHUB_REF_NAME}; then
          git show -s --format=%B ${GITHUB_REF_NAME} | tail -n +4 | gh release create ${GITHUB_REF_NAME} -t ${GITHUB_REF_NAME} -F -
          fi

  publish-rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: contains(github.ref, 'refs/tags/v')
    needs: create-github-release
    name: Publish Rust crate
    steps:
        - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        - run:
            cargo publish ${CARGO_PUBLISH_ARGS:-} --no-verify
          env:
              CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  package-python:
    name: Build Python distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - create-github-release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools wheel build

      - name: Build a binary wheel and a source tarball
        run: python3 -m build
      - name: Store the distribution packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions
          path: dist/

  publish-python:
    name: >-
      Publish Python distribution to OSS Exit Gate
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    needs:
      - package-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gfmetadata/
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation with OSS Exit Gate
    steps:
      - name: Download built Python distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install upload tool before authentication
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/eg-venv"
          "${RUNNER_TEMP}/eg-venv/bin/pip" install --no-cache-dir --quiet twine==6.1.0

      - name: Extract package metadata
        id: pkg_meta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "${GITHUB_OUTPUT}"
          import email, glob, os, sys, tarfile, zipfile
          names, versions = set(), set()
          files = sorted(glob.glob("dist/*.whl") + glob.glob("dist/*.tar.gz"))
          if not files:
              sys.exit("ERROR: no wheel or sdist found under dist/")
          for path in files:
              if path.endswith(".whl"):
                  with zipfile.ZipFile(path) as zf:
                      meta_files = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")]
                      msg = email.message_from_bytes(zf.read(meta_files[0]))
              else:
                  with tarfile.open(path, "r:gz") as tf:
                      pkg_infos = [m for m in tf.getmembers() if m.name.count("/") == 1 and m.name.endswith("/PKG-INFO")]
                      msg = email.message_from_bytes(tf.extractfile(pkg_infos[0]).read())
              names.add(msg["Name"].strip())
              versions.add(msg["Version"].strip())
          if len(names) != 1 or len(versions) != 1:
              sys.exit(f"ERROR: expected single package/version, got names={names} versions={versions}")
          print(f"package_name={next(iter(names))}")
          print(f"package_version={next(iter(versions))}")
          PY

      - name: Authenticate to OSS Exit Gate via WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: "projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github"

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Upload distributions to Artifact Registry and trigger release
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.pkg_meta.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.pkg_meta.outputs.package_version }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          AR_PROJECT: oss-exit-gate-prod
          AR_LOCATION: us
          AR_REPO: gf-metadata--pypi
          MANIFEST_BUCKET: gs://oss-exit-gate-prod-projects-bucket/gf-metadata/pypi/manifests
        run: |
          set -euo pipefail
          umask 077
          manifest_path="${RUNNER_TEMP}/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
          trap 'rm -f "${manifest_path}"' EXIT

          # Remove only the colliding package version (if a prior run failed/retried).
          gcloud artifacts versions delete "${PACKAGE_VERSION}" \
            --project="${AR_PROJECT}" \
            --location="${AR_LOCATION}" \
            --repository="${AR_REPO}" \
            --package="${PACKAGE_NAME}" \
            --quiet || true

          TWINE_PASSWORD="$(gcloud auth print-access-token)"
          if [ -z "${TWINE_PASSWORD}" ]; then
            echo "ERROR: failed to obtain access token from gcloud" >&2
            exit 1
          fi
          echo "::add-mask::${TWINE_PASSWORD}"
          export TWINE_USERNAME="oauth2accesstoken"
          export TWINE_PASSWORD

          "${RUNNER_TEMP}/eg-venv/bin/twine" upload \
            --non-interactive \
            --repository-url "https://us-python.pkg.dev/${AR_PROJECT}/${AR_REPO}/" \
            dist/*

          jq -n \
            --arg name "${PACKAGE_NAME}" \
            --arg ver "${PACKAGE_VERSION}" \
            '{
              publish_all: false,
              publishing_groups: [
                {
                  packages: [
                    { name: $name, version: $ver }
                  ]
                }
              ]
            }' > "${manifest_path}"

          gcloud storage cp --if-generation-match=0 \
            "${manifest_path}" \
            "${MANIFEST_BUCKET}/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
